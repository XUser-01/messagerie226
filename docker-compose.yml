name: messagerie226
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node docker/prepare.mjs first}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U synapse -d synapse']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [matrix]
  synapse:
    image: ghcr.io/element-hq/synapse:v1.164.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    volumes:
      - ./docker/runtime:/config:ro
      - synapse_data:/data
    ports:
      - '127.0.0.1:8008:8008'
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8008/health", timeout=4)']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [matrix, client_access]
networks:
  client_access:
    driver: bridge
  matrix:
    internal: true
volumes:
  postgres_data:
  synapse_data:
