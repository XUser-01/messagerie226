worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types application/wasm application/javascript text/css application/json;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; img-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /health { return 200 'ok'; }
    location ~ ^/(server|docker|\.git|\.env|_synapse)(/|\.|$) { return 404; }
    location /_matrix/ {
      proxy_pass http://synapse:8008;
      proxy_read_timeout 90s;
      proxy_set_header Host $host;
    }
    location /api/ {
      proxy_pass http://administration_api:3001;
      proxy_read_timeout 30s;
      proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
